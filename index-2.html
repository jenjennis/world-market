<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мировой рынок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Идея: биржевой терминал для учебной игры. Крупные моно-цифры, узкий заголовочный шрифт, маска года «машины времени». */
:root{
  color-scheme: light;
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f5f7fa; --ink:#101826; --ink2:#4a566a; --ink3:#7a8599;
  --line:#d5dbe4; --btn:#12263f; --btnink:#ffffff; --focus:#2a78d6;
  --good:#0b7a53; --bad:#c7243d; --warn:#9a5b00;
  --t0:#2a78d6; --t1:#eb6834; --t2:#1baf7a; --t3:#eda100; --t4:#e87ba4;
  --fd:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --fb:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1420; --panel:#151e2d; --panel2:#1b2638; --ink:#eaf0f8; --ink2:#a4b1c4; --ink3:#74829a;
    --line:#26324a; --btn:#e4ecf7; --btnink:#0d1420; --focus:#5598e7;
    --good:#3fc58f; --bad:#ff7088; --warn:#e0a53a;
    --t0:#3987e5; --t1:#d95926; --t2:#199e70; --t3:#c98500; --t4:#d55181;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1420; --panel:#151e2d; --panel2:#1b2638; --ink:#eaf0f8; --ink2:#a4b1c4; --ink3:#74829a;
  --line:#26324a; --btn:#e4ecf7; --btnink:#0d1420; --focus:#5598e7;
  --good:#3fc58f; --bad:#ff7088; --warn:#e0a53a;
  --t0:#3987e5; --t1:#d95926; --t2:#199e70; --t3:#c98500; --t4:#d55181;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body.host{font-size:clamp(16px,1.2vw,24px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;padding:0 18px 40px}
.pw{max-width:560px}

/* верхняя панель */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em}
.mark{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--btn);color:var(--btnink);font-size:.8rem;border-radius:4px}
.grow{flex:1}
.pill{font-family:var(--fm);font-size:.82rem;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ink2);background:var(--panel2)}
.sync{font-size:.8rem;color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink3)}
.sync.live::before{background:var(--good)} .sync.error::before{background:var(--bad)} .sync.local::before,.sync.code::before{background:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--btn);color:var(--btnink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}

/* элементы */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h2{font-size:1.5rem;margin-bottom:10px}
.card h3{font-size:1.1rem;margin-bottom:8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;background:var(--btn);color:var(--btnink);border:0;border-radius:8px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1em;padding:12px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)} .tiny{font-size:.82rem;color:var(--ink3)}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.tname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.badge{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--panel2)}
.good{color:var(--good)} .bad{color:var(--bad)}
.hero{padding:26px 0 14px}
.hero h1{font-size:clamp(2rem,5vw,3.6rem);text-transform:uppercase}
.hero p{max-width:60ch;color:var(--ink2);margin:10px 0 0}
.year{font-family:var(--fm);font-weight:600;font-size:clamp(2.4rem,6vw,4.4rem);letter-spacing:.08em;line-height:1}
.year.hidden{color:var(--ink3)}
.eyebrow{font-family:var(--fm);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3)}
.facts{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.facts li{padding:10px 14px;border-left:4px solid var(--line);background:var(--panel2);border-radius:0 8px 8px 0}
body.host .facts li{font-size:1.1em}
.q{margin-top:14px;font-family:var(--fd);font-weight:700;font-size:1.3em}
.timer{font-family:var(--fm);font-weight:600;font-size:clamp(2.6rem,6vw,5rem);line-height:1}
.timer.low{color:var(--bad)}

/* список команд */
.team-card{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:12px;background:var(--panel)}
.team-card .row{flex-wrap:nowrap}
.team-card ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);min-height:1.4em}
.prog{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:var(--c);width:var(--w)}
.lb{display:grid;gap:8px}
.lb .r{display:grid;grid-template-columns:2ch 1fr auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--panel2)}
.lb .r.me{outline:2px solid var(--focus)}
.lb .pos{font-family:var(--fm);color:var(--ink3)}

/* ползунки */
.asset{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.asset label{font-weight:500}
.asset .v{font-family:var(--fm);font-weight:600;text-align:right;min-width:4ch}
.asset input[type=range]{grid-column:1/-1;width:100%;height:36px;accent-color:var(--btn)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{min-height:52px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;font-weight:600}
.rate button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.rate button:disabled{opacity:.4}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.note{padding:12px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.note.insider{border-color:var(--warn);background:transparent}
.note b{font-family:var(--fd)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--btn);flex:none}

/* лента доходностей */
.tape{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tape .c{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.tape .c small{display:block;color:var(--ink2);font-size:.8rem}
.tape .c b{font-family:var(--fm);font-size:1.35em}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--ink2);font-size:.85rem}
.scroll{overflow-x:auto}
/* расходящиеся столбики */
.brow{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:10px;align-items:center;padding:6px 0}
.btrack{position:relative;height:30px;display:grid;grid-template-columns:1fr 1fr}
.btrack::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.bl,.br{display:flex;align-items:center;height:100%}
.bl{justify-content:flex-end}
.bar{height:100%;background:var(--c);border-radius:4px;min-width:3px}
.bl .bar{border-radius:4px 0 0 4px}.br .bar{border-radius:0 4px 4px 0}
.bval{font-family:var(--fm);font-weight:600;padding:0 8px;white-space:nowrap}
.terms{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.terms .badge{font-size:.9em;color:var(--ink);border-color:var(--ink3)}
.reason{margin:6px 0 0;padding-left:12px;border-left:3px solid var(--line);color:var(--ink2);font-size:.92em}
details>summary{cursor:pointer;color:var(--ink2);padding:6px 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
svg text{fill:var(--ink2);font-family:var(--fb)}
.medal{font-family:var(--fd);font-weight:700;font-size:1.05em}
.center{text-align:center}
#codeText{font-family:var(--fm);font-size:1rem;word-break:break-all}
[hidden]{display:none!important}
.spacer{height:12px}

.step{display:flex;gap:12px;align-items:center;margin:26px 0 10px}
.step h2{font-size:1.4rem}
.sn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--btnink);font-family:var(--fm);font-weight:600;flex:none}
.howto{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:n}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:n}
.howto li::before{content:counter(n);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--btnink);font-family:var(--fm);font-weight:600}
.howto li>div{padding-top:4px}
.choice{display:flex;flex-direction:column;gap:12px}
.choice h2{font-size:1.8rem}
.bigcode{display:block;width:100%;font-family:var(--fm);font-size:1.05rem}
.roundbig{font-family:var(--fd);font-weight:700;font-size:clamp(2rem,4vw,3.2rem);text-transform:uppercase;line-height:1}
.ok{color:var(--good);font-weight:600}
.minibar{position:sticky;top:57px;z-index:4;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.stickybtn{position:sticky;bottom:0;padding:12px 0;background:var(--bg)}
@media (max-width:520px){ .wrap{padding:0 12px 32px} .top{padding:10px 12px} }
@media (prefers-reduced-motion: no-preference){ .prog>i{transition:width .3s} }
</style>
</head>

<div id="app"><div class="wrap pw"><p class="muted" style="padding-top:40px">Загрузка игры…</p></div></div>
<script>
/* ===== ENGINE: чистые функции игры, без DOM ===== */

const K = { stockRate: 3.5, bondRate: 3, fxStock: 2, fxBond: 4, defend: 5, imfFee: 3, imfHalf: 0.6 };

const ROUNDS = EVENTS.length;

const sum = a => a.reduce((s, x) => s + x, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* Ползунок: задаёт вес k, остальное пропорционально перераспределяется. Целые, сумма 100. */
function setWeight(w, k, v) {
  v = clamp(Math.round(v), 0, 100);
  const others = w.map((_, i) => i).filter(i => i !== k);
  const rest = 100 - v;
  const s = sum(others.map(i => w[i]));
  const raw = w.slice();
  raw[k] = v;
  others.forEach(i => { raw[i] = s === 0 ? rest / others.length : w[i] * rest / s; });
  const fl = raw.map(Math.floor);
  let left = 100 - sum(fl);
  const order = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (let j = 0; left > 0 && j < order.length; j++, left--) {
    if (order[j][1] === k) { left++; continue; }
    fl[order[j][1]]++;
  }
  if (left > 0) fl[k] += left;
  return fl;
}

/* Решение команды из голосов участников. */
function aggregate(votes, prev) {
  if (!votes.length) {
    return { w: prev ? prev.w.slice() : [20, 20, 20, 20, 20], rate: 0, imf: false, reasons: [], auto: true, voters: 0 };
  }
  const w = [0, 1, 2, 3, 4].map(k => sum(votes.map(v => v.w[k])) / votes.length);
  const cnt = { '-1': 0, '0': 0, '1': 0 };
  votes.forEach(v => { cnt[String(v.rate)]++; });
  const max = Math.max(cnt['-1'], cnt['0'], cnt['1']);
  const top = ['-1', '0', '1'].filter(k => cnt[k] === max);
  const rate = top.length === 1 ? Number(top[0]) : 0;
  const imf = votes.filter(v => v.imf).length * 2 > votes.length;
  const reasons = votes.filter(v => v.reason && v.reason.trim()).map(v => ({ name: v.name || '', text: v.reason.trim() }));
  return { w, rate, imf, reasons, auto: false, voters: votes.length };
}

/* Расчёт раунда. decisions[i] = {w, rate, imf}; capitals[i]; imfCond[i] = обязательство после МВФ. */
function resolveRound(ev, n, decisions, capitals, imfCond) {
  const rates = [];
  for (let i = 0; i < n; i++) {
    let r = decisions[i].rate, forced = false;
    if (imfCond && imfCond[i] && r < 0) { r = 0; forced = true; }
    rates.push({ r, forced });
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = decisions[i];
    const r = rates[i].r;
    const others = rates.filter((_, j) => j !== i).map(x => x.r);
    const mean = others.length ? sum(others) / others.length : 0;
    const diff = r - mean;
    const p = ev.fx[i];
    const rateStock = -K.stockRate * r + K.fxStock * diff + p * K.defend * r;
    const rateBond = -K.bondRate * r + K.fxBond * diff + p * K.defend * r;
    let stockRet = ev.stocks[i] + rateStock;
    let bondRet = ev.bonds[i] + rateBond;
    if (d.imf) {
      if (stockRet < 0) stockRet *= K.imfHalf;
      if (bondRet < 0) bondRet *= K.imfHalf;
    }
    const rets = [stockRet, bondRet, ev.usd, ev.gold, ev.oil];
    const port = sum(rets.map((x, k) => d.w[k] / 100 * x));
    let cap = capitals[i] * (1 + port / 100);
    if (d.imf) cap -= capitals[i] * K.imfFee / 100;
    const rateContrib = (d.w[0] * rateStock + d.w[1] * rateBond) / 100;
    out.push({ rets, port, cap, rate: r, forced: rates[i].forced, rateContrib, imf: !!d.imf, w: d.w.slice() });
  }
  return out;
}

function randomDecision() {
  let w = [0, 0, 0, 0, 0].map(() => Math.random() + 0.15);
  const s = sum(w);
  w = w.map(x => x / s * 100);
  let fl = w.map(Math.floor);
  fl[0] += 100 - sum(fl);
  return { w: fl, rate: [-1, 0, 1][Math.floor(Math.random() * 3)], imf: Math.random() < 0.05 };
}

/* Награды по истории. history[r] = {res:[{port,cap,rateContrib,w}]} */
function computeAwards(history, n) {
  const stat = [];
  for (let i = 0; i < n; i++) {
    const conc = history.map(h => sum(h.res[i].w.map(x => (x / 100) * (x / 100))));
    const cb = sum(history.map(h => h.res[i].rateContrib));
    stat.push({ conc: sum(conc) / Math.max(1, conc.length), cb });
  }
  const arg = (f, cmp) => stat.map((s, i) => [f(s), i]).sort((a, b) => cmp(a[0], b[0]) || a[1] - b[1])[0][1];
  return {
    cautious: arg(s => s.conc, (a, b) => a - b),
    risky: arg(s => s.conc, (a, b) => b - a),
    banker: arg(s => s.cb, (a, b) => b - a)
  };
}

function hostResolve() {
  const n = S.n, r = S.round, ev = EVENTS[r - 1];
  const prev = S.history.length ? S.history[S.history.length - 1].res : null;
  const decs = [], reasons = [], voters = [], autos = [];

    if (m) d = { w: normW(m.w), rate: m.rate, imf: !!m.imf, reasons: [{ name: 'Ведущий', text: 'решение введено вручную' }], auto: false, voters: 0 };

    decs.push({ w: d.w, rate: d.rate, imf: d.imf });
    reasons.push(d.reasons); voters.push(d.voters); autos.push(!!d.auto);
  }

  commit({ phase: 'reveal', history: S.history.concat([hist]), imfUsed: S.imfUsed.map((u, i) => u || res[i].imf), imfCond: res.map(x => x.imf) });

function barChart(res, prevCaps, n) {
  const ch = res.map((x, i) => (x.cap / prevCaps[i] - 1) * 100);
  const mx = Math.max(5, ...ch.map(Math.abs));
  return ch.map((d, i) => {
    const w = Math.abs(d) / mx * 100;
    const bar = `<span class="bar" style="width:${w}%;--c:var(--t${i})"></span>`;
    return `<div class="brow">${tname(i)}<div class="btrack"><div class="bl">${d < 0 ? `<span class="bval bad">${arrow(d)} ${sgn(d)}</span>` + bar : ''}</div><div class="br">${d >= 0 ? bar + `<span class="bval ${cls(d)}">${arrow(d)} ${sgn(d)}</span>` : ''}</div></div></div>`;
  }).join('');
}

function lineChart(n) {
  const series = TEAMS.slice(0, n).map((t, i) => [START_CAP].concat(S.history.map(h => h.caps[i])));
  const W = 680, H = 330, L = 46, R = 118, T = 14, B = 34;
  const all = series.flat();
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = Math.max(3, (hi - lo) * 0.08); lo = Math.floor((lo - pad) / 5) * 5; hi = Math.ceil((hi + pad) / 5) * 5;
  const X = j => L + (W - L - R) * j / (ROUNDS), Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const step = (hi - lo) > 80 ? 20 : (hi - lo) > 40 ? 10 : 5;
  let grid = '';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12">${v}</text>`;
  const xl = ['Старт'].concat(Array.from({ length: ROUNDS }, (_, j) => 'Р' + (j + 1))).map((l, j) => `<text x="${X(j)}" y="${H - 10}" text-anchor="middle" font-size="12">${l}</text>`).join('');
  const ends = series.map((s, i) => [Y(s[s.length - 1]), i]).sort((a, b) => a[0] - b[0]);
  const ly = {}; let last = -99;
  ends.forEach(([y, i]) => { const yy = Math.max(y, last + 15); ly[i] = yy; last = yy; });
  const lines = series.map((s, i) => {
    const pts = s.map((v, j) => `${X(j)},${Y(v)}`).join(' ');
    const dots = s.map((v, j) => `<circle cx="${X(j)}" cy="${Y(v)}" r="${j === s.length - 1 ? 6 : 4}" fill="var(--t${i})" stroke="var(--panel)" stroke-width="2"><title>${esc(TEAMS[i].name)}: ${nf(v)}</title></circle>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="var(--t${i})" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${X(s.length - 1) + 12}" y="${ly[i] + 4}" font-size="13" style="fill:var(--ink)">${esc(TEAMS[i].short || TEAMS[i].name)} ${nf(s[s.length - 1], 0)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Капитал команд по раундам">${grid}${xl}${lines}</svg>
    <div class="legend">${TEAMS.slice(0, n).map((t, i) => tname(i)).join('')}</div>`;
}

        <p class="tiny">Передумали? Измените решение и получите код заново: старый код отправлять не нужно.</p></div></div>
    <p class="tiny center" style="margin-top:12px">Результат раунда смотрите на экране ведущего.</p>
    <div class="stickybtn"><button class="btn big" style="width:100%" id="codeBtn" data-act="c-make">Получить код решения</button></div></div>`;
}
const RATE_HINT = {
  '1': 'Повышение привлекает капитал и защищает курс валюты, но давит на цены акций и облигаций региона.',
  '0': 'Ставка не меняется. Эффект зависит от того, что сделают другие страны.',
  '-1': 'Снижение поддерживает акции и облигации, но ослабляет валюту и усиливает отток капитала.'
};
function paintWeights() {
  [0, 1, 2, 3, 4].forEach(k => {
    const el = document.getElementById('w' + k), v = document.getElementById('wv' + k);
    if (el) el.value = draft.w[k];
    if (v) v.textContent = draft.w[k] + '%';
  });
}
function paintRate() {
  document.querySelectorAll('.rate button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === draft.rate));
  const h = document.getElementById('rateHint'); if (h) h.textContent = RATE_HINT[String(draft.rate)];
  const c = document.getElementById('imf'); if (c) c.checked = draft.imf && !c.disabled;
}
/* ---------- таймер ---------- */
function tick() {
  const el = document.getElementById('timer');
  if (!el || !S || S.phase !== 'decide') return;
  const rem = Math.ceil((S.deadline - Date.now()) / 1000);
  el.textContent = mmss(rem);
  el.classList.toggle('low', rem <= 15);
}
setInterval(tick, 500);


/* ---------- события ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, t = el.dataset.t != null ? Number(el.dataset.t) : null;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return;
  switch (act) {
    case 'choose':
      if (v === 'host') { ctx.view = 'host'; S = S || newState(ui.cfgN, ui.cfgDur); } else ctx.view = 'code';
      lastKey = ''; render(); window.scrollTo(0, 0); break;
    case 'cfg-n': hostSetCfg(Number(v), 0); break;
    case 'cfg-dur': hostSetCfg(0, Number(v)); break;
    case 'start': hostStart(); window.scrollTo(0, 0); break;
    case 'extend': commit({ deadline: Math.max(S.deadline, Date.now()) + 30000 }); break;
    case 'resolve': hostResolve(); window.scrollTo(0, 0); break;
    case 'next': hostNext(); window.scrollTo(0, 0); break;
    case 'reset': ui.confirmReset = true; render(); break;
    case 'reset-no': ui.confirmReset = false; render(); break;
    case 'reset-yes': hostReset(); window.scrollTo(0, 0); break;
    case 'm-rate': manualEntry(S.round, t).rate = Number(v); ui.manualOpen = true; render(); break;
    case 'm-bot': Object.assign(manualEntry(S.round, t), randomDecision()); ui.manualOpen = true; render(); break;
    case 'ingest': hostIngest(); break;
    case 'c-team': {
      const nm = document.getElementById('nameInput'); if (nm) cs.name = nm.value;
      cs.team = Number(v) < 0 ? null : Number(v); cs.code = ''; saveCs(); lastKey = ''; render(); window.scrollTo(0, 0); break;
    }
    case 'c-round': cs.round = Number(v); cs.code = ''; draft.rate = 0; draft.imf = false; draft.reason = ''; saveCs(); lastKey = ''; render(); break;
    case 'rate': draft.rate = Number(v); paintRate(); codeDirty(); break;
    case 'c-make': {
      cs.code = makeCode();
      const o = document.getElementById('codeOut'), tx = document.getElementById('codeText');
      if (o && tx) { o.hidden = false; tx.value = cs.code; tx.select(); o.scrollIntoView({ block: 'center' }); }
      break;
    }
    case 'c-sel': el.select(); break;
    case 'c-copy': {
      const msg = document.getElementById('copyMsg');
      const done = ok => { if (msg) msg.textContent = ok ? 'Скопировано. Отправьте в чат.' : 'Выделите код и скопируйте вручную'; };
      try { navigator.clipboard.writeText(cs.code).then(() => done(true), () => { const tx = document.getElementById('codeText'); if (tx) tx.select(); done(false); }); }
      catch (e) { const tx = document.getElementById('codeText'); if (tx) tx.select(); done(false); }
      break;
    }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (!el.dataset) return;
  if (el.dataset.act === 'imf') { draft.imf = el.checked; paintRate(); codeDirty(); }
  if (el.dataset.act === 'autobots') ui.autoBots = el.checked;
  if (el.dataset.act === 'm-imf') manualEntry(S.round, Number(el.dataset.t)).imf = el.checked;
  if (el.dataset.m) { const [tm, k] = el.dataset.m.split(':').map(Number); manualEntry(S.round, tm).w[k] = clamp(Number(el.value) || 0, 0, 100); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.classList && el.classList.contains('slider')) { draft.w = setWeight(draft.w, Number(el.dataset.k), Number(el.value)); paintWeights(); codeDirty(); }
  else if (el.id === 'reason') { draft.reason = el.value; codeDirty(); }
  else if (el.id === 'nameInput') { cs.name = el.value; saveCs(); }
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'manualBox') ui.manualOpen = ev.target.open; }, true);

/* ---------- запуск ---------- */
try { const s = JSON.parse(localStorage.getItem('mr-cs') || 'null'); if (s) { cs.name = s.name || ''; cs.team = s.team; cs.round = s.round || 1; } } catch (e) {}
render();
</script>
</body>
</html>
